  sequenceRules1:
    activities:
      - type: configurable-status
        configuration:
          status_to_set: FAIL
        continueOn: [] # Continue on any status

      - type: configurable-status
        configuration:
          status_to_set: FAIL
        continueOn:
          - FAIL                # Will try to continue on FAIL

      - type: configurable-status
        configuration:
          status_to_set: SUCCESS
        continueOn:
          - FAIL                # Will not continue, as it needs FAIL to continue.

      - type: configurable-status # Will not be triggered.
        configuration:
          status_to_set: SUCCESS



  sequenceRules2:
    activities:
      - type: configurable-status  # Action: RUN
        name: first
        configuration:
          status_to_set: FAIL
        continueOn: [] # Continue on any status

      - type: configurable-status # Action: RUN
        name: second
        configuration:
          status_to_set: ABORTED
        continueOn: [] # Continue on any status

      - type: configurable-status
        name: third
        configuration:
          status_to_set: SUCCESS
        runOn:                    # Conditions are true -> Action: RUN
          activityStatus:
            first:
              - FAIL
            second:
              - ABORTED           # SUCCESS -> continue by default


      - type: configurable-status
        name: fourth
        configuration:
          status_to_set: SUCCESS
        runOn:                    # Condition fails -> SKIP_BY_CONFIG -> the activity will not be run and will have status SKIPPED -> continue
          activityStatus:
            first:
              - FAIL
            second:
              - FAIL

      - type: configurable-status # -> skipped by framework because of previous activity skip.
        name: fifth
        configuration:
          status_to_set: SUCCESS
        runOn:                        # Condition true -> Action: RUN
          activityStatus:
            third:
              - SUCCESS

      - type: configurable-status # Default conditions true -> Action: RUN
        name: sixth
        configuration:
          status_to_set: SUCCESS


      - type: configurable-status
        name: seventh
        configuration:
          status_to_set: FAIL # Default config interrupts on FAIL -> Action: SKIP_BY_FRAMEWORK

      - type: configurable-status # Previous SKIP_BY_FRAMEWORK -> next SKIP_BY_FRAMEWORK
        name: eighth
        configuration:
          status_to_set: SUCCESS
        runOn:
          activityStatus:
            seventh:
              - FAIL # Will still not run as the previous activity continue_on condition will not allow to continue.

      - type: configurable-status # Will not run, as the activity block has been interrupted. After SKIPPED_BY_FRAMEWORK no activities will be run.
        name: ninth
        configuration:
          status_to_set: SUCCESS
        runOn:
          activityStatus:
            eighth: [] # Continue on any status







  sequenceRulesTest_not_used_in_any_test:
    activities:
